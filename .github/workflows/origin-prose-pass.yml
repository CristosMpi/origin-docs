name: ORIGIN documentation prose pass

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  prose-pass:
    if: github.event.issue.title == 'Run ORIGIN prose pass'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite explanatory bullet lists as prose
        run: python tools/prose_pass.py

      - name: Commit documentation changes
        run: |
          if git diff --quiet; then
            echo 'No documentation changes required.'
          else
            git config user.name 'Team Galene Docs Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -u
            git commit -m 'Refine documentation prose and presentation [skip ci]'
            git push
          fi

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Documentation prose pass completed."
