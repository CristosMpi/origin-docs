name: ORIGIN documentation prose pass

on:
  push:
    paths:
      - 'tools/prose_pass.py'
      - '.github/workflows/origin-prose-pass.yml'

permissions:
  contents: write

jobs:
  prose-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite explanatory bullet lists as prose
        run: python tools/prose_pass.py

      - name: Commit documentation changes
        run: |
          if git diff --quiet; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git config user.name 'Team Galene Docs Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git commit -m 'Refine documentation prose and presentation [skip ci]'
          git push
